[project]
name = "google-drive-easy"
version = "0.0.3"
description = "Google Drive with Python, but easy"
authors = [
    {name = "danialcala94",email = "danielalcalavalera@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"

[project.urls]
Homepage = "https://github.com/Implosiv3/google-drive-easy"
Issues = "https://github.com/Implosiv3/google-drive-easy/issues"

[tool.poetry.dependencies]
# Mandatory
google-auth-easy = { version = ">=0.0.5,<1.0.0", optional = false }
# Optional

[tool.poetry]
packages = [{include = "google_drive_easy", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[tool.pytest.ini_options]
markers = [
    "mandatory: mandatory tests for release",
    "additional: exhaustive and demanding tests"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
